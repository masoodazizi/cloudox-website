<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0f234c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <g transform="translate(80, 90)" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M28 70h-3a17 17 0 0 1-3-33.7A22 22 0 0 1 64 28"/>
    <rect x="48" y="28" width="52" height="56" rx="5"/>
    <line x1="58" y1="44" x2="90" y2="44"/>
    <line x1="58" y1="56" x2="90" y2="56"/>
    <line x1="58" y1="68" x2="80" y2="68"/>
  </g>

  <text x="220" y="160" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="700" letter-spacing="-2">Cloudox</text>

  <text x="80" y="320" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="600" letter-spacing="-1.5">
