<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CloudoX - Intelligent Cloud Knowledge Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#2f80ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f80ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="100" y="150" font-size="22" letter-spacing="4" font-weight="600" fill="#58a3ff">INTELLIGENT CLOUD KNOWLEDGE PLATFORM</text>

    <text x="96" y="300" font-size="150" font-weight="700" letter-spacing="-3">
      <tspan fill="#f7f8fa">Cloudo</tspan><tspan fill="#2f80ff">X</tspan>
    </text>

    <text x="100" y="392" font-size="44" font-weight="600" fill="#eef0f4">Understand any cloud environment</text>
    <text x="100" y="450" font-size="44" font-weight="600" fill="#eef0f4">in under 30 minutes.</text>

    <text x="100" y="548" font-size="26" font-weight="500" fill="#8b95a7">Evidence-grounded discovery, interpretation, and documentation.</text>
    <text x="1100" y="548" font-size="26" font-weight="600" fill="#58a3ff" text-anchor="end">cloudox.io</text>
  </g>
</svg>
