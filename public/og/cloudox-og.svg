<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0f234c"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a3ff"/>
      <stop offset="100%" stop-color="#1a63eb"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <g transform="translate(80, 80)">
    <rect width="84" height="84" rx="20" fill="url(#logo)"/>
    <path d="M22 56c0-7 6-12.5 12.5-12.6A15 15 0 0 1 64 38a9 9 0 0 1 1.5 18"
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="28" cy="65" r="3" fill="#ffffff"/>
    <circle cx="42" cy="65" r="3" fill="#ffffff"/>
    <circle cx="56" cy="65" r="3" fill="#ffffff"/>
  </g>

  <text x="80" y="280" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5">
    Understand cloud
  </text>
  <text x="80" y="360" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5">
    environments in 30 minutes.
  </text>

  <text x="80" y="440" fill="#8b95a7" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400">
    AI-powered cloud discovery and documentation.
  </text>
  <text x="80" y="478" fill="#8b95a7" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400">
    AWS-first today, multi-cloud tomorrow.
  </text>

  <g transform="translate(80, 540)">
    <rect width="180" height="42" rx="8" fill="#2f80ff"/>
    <text x="90" y="28" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
      cloudox.io
    </text>
  </g>
</svg>
