name: Website checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/website-refresh]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
